<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ordena | Malekisho</title>
    <link rel="shortcut icon" href="../assets/favicon-16x16.png" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#4f46e5',
                            DEFAULT: '#4338ca',
                            dark: '#3730a3',
                        }
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-brand-light selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function OrdenaApp() {
            const [inputText, setInputText] = useState('');
            const [autoCopy, setAutoCopy] = useState(true);
            const [copied, setCopied] = useState(false);

            // Lógica para ordenar las palabras
            const generateSortedText = () => {
                if (!inputText.trim()) return { text: '', error: false };

                // Separar por líneas, limpiar espacios y filtrar líneas vacías
                const words = inputText.split('\n').map(word => word.trim()).filter(word => word !== '');

                if (words.length === 0) return { text: '', error: false };

                // Validación de límite (basada en tu código original)
                if (words.length > 500) {
                    return { text: '⚠️ Límite excedido. Por favor, ingresa máximo 500 palabras.', error: true };
                }

                // Ordenar alfabéticamente respetando el idioma (localeCompare es perfecto para acentos/ñ)
                const sortedWords = words.sort((a, b) => a.localeCompare(b));

                return { text: sortedWords.join('\n'), error: false };
            };

            const result = generateSortedText();
            const hasEnoughInput = result.text.length > 0 && !result.error;

            const handleCopy = async () => {
                if (!hasEnoughInput) return;
                
                try {
                    await navigator.clipboard.writeText(result.text);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (err) {
                    console.error('Error al copiar: ', err);
                }
            };

            // Efecto reactivo para el auto-copiado
            useEffect(() => {
                if (autoCopy && hasEnoughInput) {
                    handleCopy();
                }
            }, [inputText, autoCopy]);

            return (
                <div className="min-h-screen flex flex-col">
                    
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b border-slate-200">
                        <div className="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
                            <h1 className="text-xl font-extrabold text-brand tracking-tight">Malekisho</h1>
                            <a href="Dashboard.html" className="text-sm font-medium text-slate-500 hover:text-brand transition-colors flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                                </svg>
                                Volver al Dashboard
                            </a>
                        </div>
                    </header>

                    {/* Contenedor Principal */}
                    <main className="flex-grow flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 transition-all">
                            
                            <div className="p-8 sm:p-10">
                                {/* Título */}
                                <div className="text-center mb-6">
                                    <h2 className="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center justify-center gap-2">
                                        <span>😁</span> Ordena <span>😁</span>
                                    </h2>
                                    <p className="text-slate-500 mt-2 text-sm">Pega tu lista y obtén el top ordenado alfabéticamente.</p>
                                </div>

                                <div className="space-y-6">
                                    {/* Input */}
                                    <div>
                                        <textarea 
                                            className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand focus:border-brand outline-none transition-all text-sm font-mono resize-none"
                                            rows="5"
                                            placeholder="Pega tu lista aquí (una palabra/frase por línea)..."
                                            value={inputText}
                                            onChange={(e) => setInputText(e.target.value)}
                                            autoFocus
                                        ></textarea>
                                    </div>

                                    {/* Toggle de Auto-copiado */}
                                    <div className="flex items-center justify-center bg-slate-50 p-3 rounded-lg border border-slate-200">
                                        <label className="flex items-center cursor-pointer">
                                            <div className="relative">
                                                <input 
                                                    type="checkbox" 
                                                    className="sr-only" 
                                                    checked={autoCopy}
                                                    onChange={() => setAutoCopy(!autoCopy)}
                                                />
                                                <div className={`block w-10 h-6 rounded-full transition-colors ${autoCopy ? 'bg-brand' : 'bg-slate-300'}`}></div>
                                                <div className={`dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${autoCopy ? 'transform translate-x-4' : ''}`}></div>
                                            </div>
                                            <div className="ml-3 text-sm font-medium text-slate-700">Copiar automáticamente</div>
                                        </label>
                                    </div>

                                    {/* Display del resultado */}
                                    <div className={`bg-slate-100 rounded-lg border border-slate-200 p-4 min-h-[120px] max-h-[250px] overflow-auto flex items-center justify-center ${result.error ? 'border-red-300 bg-red-50' : ''}`}>
                                        <div className={`font-mono text-sm leading-relaxed whitespace-pre w-full ${result.error ? 'text-red-600 text-center font-bold' : 'text-slate-800 text-left'}`}>
                                            {result.text ? result.text : <span className="text-slate-400 italic font-sans flex justify-center w-full">El resultado aparecerá aquí...</span>}
                                        </div>
                                    </div>

                                    {/* Botón Manual de Copiar */}
                                    <button 
                                        onClick={handleCopy}
                                        disabled={!hasEnoughInput}
                                        className={`w-full font-bold py-3 px-4 rounded-lg transition-all shadow-md flex justify-center items-center gap-2
                                            ${!hasEnoughInput 
                                                ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none' 
                                                : copied 
                                                    ? 'bg-green-500 hover:bg-green-600 text-white focus:ring-green-500 shadow-green-500/30'
                                                    : 'bg-brand hover:bg-brand-dark text-white focus:ring-brand shadow-brand/30'
                                            }`}
                                    >
                                        {copied ? (
                                            <React.Fragment>
                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                                    <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                                                </svg>
                                                ¡Copiado!
                                            </React.Fragment>
                                        ) : (
                                            <React.Fragment>
                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                                                </svg>
                                                Copiar Resultado
                                            </React.Fragment>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<OrdenaApp />);
    </script>
</body>
</html>
