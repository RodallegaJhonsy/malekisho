<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torre de Dios | Malekisho</title>
    <link rel="shortcut icon" href="../assets/favicon-16x16.png" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#4f46e5',
                            DEFAULT: '#4338ca',
                            dark: '#3730a3',
                        }
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-brand-light selection:text-white">

    <div id="root">
        <div class="min-h-screen flex items-center justify-center">
            <p class="text-brand font-semibold animate-pulse">Cargando herramienta...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function TorreDeDiosApp() {
            const [inputText, setInputText] = useState('');
            const [autoCopy, setAutoCopy] = useState(true);
            const [copied, setCopied] = useState(false);

            // Función para obtener los grafemas (caracteres percibidos) del texto
            const getGraphemes = (text) => {
                if (!text) return [];
                const segmenter = new Intl.Segmenter('es', { granularity: 'grapheme' });
                const segments = Array.from(segmenter.segment(text));
                return segments.map(s => s.segment);
            };

            // Generador del patrón "Torre de Dios" (corregido para emojis compuestos)
            const generateTorreText = () => {
                if (!inputText.trim()) return '';

                // 1. Obtener todos los grafemas del input
                const graphemes = getGraphemes(inputText);

                // 2. Encontrar el índice del primer grafema que sea un emoji
                const emojiRegex = /\p{Emoji}/u;
                const emojiIndex = graphemes.findIndex(g => emojiRegex.test(g));

                if (emojiIndex === -1) return ''; // No hay emoji

                // 3. Extraer el emoji completo
                const emoji = graphemes[emojiIndex];

                // 4. Obtener los grafemas restantes (después del emoji)
                const restGraphemes = graphemes.slice(emojiIndex + 1);

                // Si no hay texto después del emoji, no generamos nada
                if (restGraphemes.length === 0) return '';

                // 5. Unir los grafemas restantes en un string para dividir en palabras
                const restText = restGraphemes.join('');
                const words = restText.split(/\s+/).filter(w => w.length > 0);

                let resultText = '';

                // 6. Procesar cada palabra respetando los grafemas internos
                words.forEach(word => {
                    const wordGraphemes = getGraphemes(word); // Divide la palabra en grafemas

                    for (let i = 1; i <= wordGraphemes.length; i++) {
                        // Según la lógica original: si es la última letra, pone doble emoji
                        const emojiRepetido = (i === wordGraphemes.length) ? emoji.repeat(2) : emoji;
                        const substring = wordGraphemes.slice(0, i).join('');

                        resultText += substring + emojiRepetido + '\n';
                    }
                    resultText += '\n'; // Salto de línea extra entre palabras
                });

                return resultText.trimEnd(); // Limpiar saltos de línea extra al final
            };

            const resultText = generateTorreText();
            const hasEnoughInput = (() => {
                if (!inputText.trim()) return false;
                const graphemes = getGraphemes(inputText);
                const emojiRegex = /\p{Emoji}/u;
                const emojiIndex = graphemes.findIndex(g => emojiRegex.test(g));
                return emojiIndex !== -1 && graphemes.length > emojiIndex + 1;
            })();

            // Función para copiar al portapapeles
            const handleCopy = async () => {
                if (!hasEnoughInput) return;
                
                try {
                    await navigator.clipboard.writeText(resultText);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (err) {
                    console.error('Error al copiar: ', err);
                }
            };

            // Efecto reactivo para el auto-copiado
            useEffect(() => {
                if (autoCopy && hasEnoughInput) {
                    handleCopy();
                }
            }, [inputText, autoCopy]);

            return (
                <div className="min-h-screen flex flex-col">
                    
                    {/* Header */}
                    <header className="bg-white shadow-sm border-b border-slate-200">
                        <div className="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
                            <h1 className="text-xl font-extrabold text-brand tracking-tight">Malekisho</h1>
                            <a href="Dashboard.html" className="text-sm font-medium text-slate-500 hover:text-brand transition-colors flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                                </svg>
                                Volver al Dashboard
                            </a>
                        </div>
                    </header>

                    {/* Contenedor Principal */}
                    <main className="flex-grow flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 transition-all">
                            
                            <div className="p-8 sm:p-10">
                                {/* Título */}
                                <div className="text-center mb-6">
                                    <h2 className="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center justify-center gap-2">
                                        <span>🗼</span> Torre de Dios <span>🗼</span>
                                    </h2>
                                    <p className="text-slate-500 mt-2 text-sm">Construye una torre letra por letra, coronada con doble emoji.</p>
                                </div>

                                <div className="space-y-6">
                                    {/* Input Único */}
                                    <div>
                                        <input 
                                            type="text" 
                                            className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand focus:border-brand outline-none transition-all text-center text-lg"
                                            placeholder="Ej: Hola 🗼 (Emoji + Frase)"
                                            value={inputText}
                                            onChange={(e) => setInputText(e.target.value)}
                                            autoFocus
                                        />
                                    </div>

                                    {/* Toggle de Auto-copiado */}
                                    <div className="flex items-center justify-center bg-slate-50 p-3 rounded-lg border border-slate-200">
                                        <label className="flex items-center cursor-pointer">
                                            <div className="relative">
                                                <input 
                                                    type="checkbox" 
                                                    className="sr-only" 
                                                    checked={autoCopy}
                                                    onChange={() => setAutoCopy(!autoCopy)}
                                                />
                                                <div className={`block w-10 h-6 rounded-full transition-colors ${autoCopy ? 'bg-brand' : 'bg-slate-300'}`}></div>
                                                <div className={`dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${autoCopy ? 'transform translate-x-4' : ''}`}></div>
                                            </div>
                                            <div className="ml-3 text-sm font-medium text-slate-700">Copiar automáticamente</div>
                                        </label>
                                    </div>

                                    {/* Display del resultado */}
                                    <div className="bg-slate-100 rounded-lg border border-slate-200 p-4 min-h-[160px] max-h-[300px] overflow-auto flex justify-center">
                                        <div className="font-mono text-xl leading-tight whitespace-pre text-left text-brand-dark">
                                            {hasEnoughInput ? resultText : (
                                                <span className="text-slate-400 text-sm italic font-sans flex justify-center text-center w-full">
                                                    {inputText.trim() && !inputText.match(/\p{Emoji}/u) 
                                                        ? "Asegúrate de incluir un emoji..." 
                                                        : "La torre aparecerá aquí..."}
                                                </span>
                                            )}
                                        </div>
                                    </div>

                                    {/* Botón Manual de Copiar */}
                                    <button 
                                        onClick={handleCopy}
                                        disabled={!hasEnoughInput}
                                        className={`w-full font-bold py-3 px-4 rounded-lg transition-all shadow-md flex justify-center items-center gap-2
                                            ${!hasEnoughInput 
                                                ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none' 
                                                : copied 
                                                    ? 'bg-green-500 hover:bg-green-600 text-white focus:ring-green-500 shadow-green-500/30'
                                                    : 'bg-brand hover:bg-brand-dark text-white focus:ring-brand shadow-brand/30'
                                            }`}
                                    >
                                        {copied ? (
                                            <React.Fragment>
                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                                    <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                                                </svg>
                                                ¡Copiado!
                                            </React.Fragment>
                                        ) : (
                                            <React.Fragment>
                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                                                </svg>
                                                Copiar Resultado
                                            </React.Fragment>
                                        )}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<TorreDeDiosApp />);
    </script>
</body>
</html>
