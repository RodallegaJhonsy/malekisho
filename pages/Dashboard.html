<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malekisho | Dashboard</title>
    <link rel="shortcut icon" href="../assets/favicon-16x16.png" type="image/x-icon">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#4f46e5',
                            DEFAULT: '#4338ca',
                            dark: '#3730a3',
                        }
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-brand-light selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        // --- BASE DE DATOS DE LAS SECCIONES ---
        // Aquí puedes agregar, quitar o modificar tus herramientas fácilmente
        const sectionsData = [
            { title: "🪱 Gusanito 🪱", link: "Gusanito.html", example: "MaLekIsHo" },
            { title: "Al Revés 🔙", link: "Al-Reves.html", example: "ohsikelaM" },
            { title: "🪖 C. De Guerra 🪖", link: "C_De_Guerra.html", example: "M4l3k1sh8" },
            { title: "🎡 Carrusel 🎡", link: "Carrusel.html", example: "🔙💤❌🪨\n💤❌🪨🔙\n❌🪨🔙💤\n🪨🔙💤❌\n🔙💤❌🪨" },
            { title: "✖️ Arma La X ✖️", link: "ArmaLaX.html", example: "💤✖️✖️✖️💤\n✖️💤✖️💤✖️\n✖️✖️💤✖️✖️\n✖️💤✖️💤✖️\n💤✖️✖️✖️💤" },
            { title: "📦 Cajota 📦", link: "Cajota.html", example: "📦📦📦📦📦\n📦🪖🪖🪖📦\n📦🪖✖️🪖📦\n📦🪖🪖🪖📦\n📦📦📦📦📦" },
            { title: "🪜 Escalerita 🪜", link: "Escalerita.html", example: "mei\nme\nm" },
            { title: "🔡 Determina 🔡", link: "Determina.html", example: "nrauto\n⬇️\nnaruto" },
            { title: "🪞 Ojo Al Espejo 🪞", link: "OjoAlEspejo.html", example: "Malek\n⬇️\nMaleKKelaM" },
            { title: "🦪 Vagina 🦪", link: "Escamoji.html", example: "🚜n\n🚜🚜nu\n🚜🚜🚜nue" },
            { title: "😭 Sin Llorar 😭", link: "Sinllorar.html", example: "" },
            { title: "Torbe2", link: "Torbe.html", example: "" },
            { title: "🗼Torre De Dios🗼", link: "TorreDeDios.html", example: "" },
            { title: "📐 Doritos 📐", link: "Doritos.html", example: "" },
            { title: "📐 Doritos V2 📐", link: "Doritos2.html", example: "" },
            { title: "🧐 Reemplaza Emoji 🧐", link: "EmoReemplaza.html", example: "" },
            { title: "🌧️ Lluvia De Emoji 🌧️", link: "LLuviaDeEmojis.html", example: "" },
            { title: "↘️ Flecha ↘️", link: "Flecha.html", example: "" },
            { title: "😁 Ordena 😁", link: "Ordena.html", example: "" },
            { title: "🥠 Emojizados 🥠", link: "Emojizados.html", example: "" },
            { title: "🕷️ Araña 🕷️", link: "Araña.html", example: "" },
            { title: "📊 Contador 📊", link: "Contador.html", example: "" },
            { title: "🔃 Palabra Espejo 🔃", link: "PalabraEspejo.html", example: "" }
        ];

        // --- COMPONENTE TARJETA (CARD) ---
        function SectionCard({ title, link, example }) {
            return (
                <a href={link} className="block group h-full">
                    <div className="bg-white rounded-xl shadow-sm border border-slate-200 p-5 h-full transition-all duration-300 hover:shadow-lg hover:border-brand-light hover:-translate-y-1 flex flex-col">
                        <h3 className="text-lg font-bold text-slate-800 text-center mb-4 group-hover:text-brand transition-colors">
                            {title}
                        </h3>
                        
                        {/* Contenedor del ejemplo que empuja hacia abajo si es necesario */}
                        <div className="bg-slate-50 rounded-lg p-3 text-sm text-slate-600 font-mono text-center flex-grow flex flex-col justify-center border border-slate-100 group-hover:bg-indigo-50/50 transition-colors">
                            <span className="block text-xs font-bold text-brand uppercase tracking-wider mb-2">
                                Ejemplo
                            </span>
                            {example ? (
                                <div className="whitespace-pre-line leading-relaxed">
                                    {example}
                                </div>
                            ) : (
                                <span className="text-slate-400 italic text-xs">Aún sin ejemplo</span>
                            )}
                        </div>
                    </div>
                </a>
            );
        }

        // --- COMPONENTE PRINCIPAL DEL DASHBOARD ---
        function Dashboard() {
            return (
                <div className="min-h-screen flex flex-col bg-slate-100">
                    
                    {/* Header Minimalista */}
                    <header className="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-10">
                        <div className="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex justify-between items-center">
                            <h1 className="text-2xl font-extrabold text-brand tracking-tight">Malekisho</h1>
                            <div className="flex items-center gap-4">
                                <span className="text-sm text-slate-500 font-medium hidden sm:block">Hola, <strong>Amel</strong></span>
                                <a href="../index.html" className="text-sm bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold py-2 px-4 rounded-lg transition-colors">
                                    Cerrar sesión
                                </a>
                            </div>
                        </div>
                    </header>

                    {/* Contenido Principal */}
                    <main className="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
                        
                        {/* Título de bienvenida */}
                        <div className="mb-10 text-center sm:text-left">
                            <h2 className="text-3xl sm:text-4xl font-extrabold text-slate-900 mb-2">
                                Panel de Herramientas
                            </h2>
                            <p className="text-slate-600 text-lg">
                                Selecciona la sección que deseas utilizar:
                            </p>
                        </div>

                        {/* Grid de Secciones */}
                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
                            {sectionsData.map((section, index) => (
                                <SectionCard 
                                    key={index} 
                                    title={section.title} 
                                    link={section.link} 
                                    example={section.example} 
                                />
                            ))}
                        </div>

                    </main>
                    
                    {/* Footer */}
                    <footer className="bg-slate-900 text-slate-400 py-6 text-center mt-auto">
                        <p className="text-sm">&copy; {new Date().getFullYear()} Malekisho. Todos los derechos reservados.</p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Dashboard />);
    </script>
</body>
</html>
