<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Emojis | Malekisho</title>
    <link rel="shortcut icon" href="../assets/favicon-16x16.png" type="image/x-icon">

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#4f46e5',
                            DEFAULT: '#4338ca',
                            dark: '#3730a3',
                        }
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-brand-light selection:text-white">

    <div id="root">
        <div class="min-h-screen flex items-center justify-center">
            <p class="text-brand font-semibold animate-pulse">Cargando herramienta...</p>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function ContadorApp() {
            const [inputText, setInputText] = useState('');
            const [countMode, setCountMode] = useState('hearts'); // 'hearts' o 'all'
            const [autoCopy, setAutoCopy] = useState(true);
            const [copied, setCopied] = useState(false);

            // Lista completa de emojis de corazón (incluye todas las variantes y secuencias ZWJ)
            const heartBases = [
                '❤', '❤️', '🧡', '💛', '💚', '💙', '💜', '🖤', '🤍', '🤎', '🩷', '🩵', '🩶',
                '💔', '❣', '❣️', '💕', '💞', '💓', '💗', '💖', '💘', '💝', '💟','❤️‍🔥', '❤️‍🩹'
            ];

            // Función para determinar si un grafema es un corazón (por inclusión, ya que pueden contener VS16)
            const isHeart = (grapheme) => {
                return heartBases.some(base => grapheme.includes(base));
            };

            // Obtiene los grafemas (caracteres percibidos) del texto
            const getGraphemes = (text) => {
                if (!text) return [];
                const segmenter = new Intl.Segmenter('es', { granularity: 'grapheme' });
                return Array.from(segmenter.segment(text)).map(s => s.segment);
            };

            // Filtra los grafemas que son emojis (usando la propiedad Unicode Emoji)
            const getEmojiGraphemes = (text) => {
                const graphemes = getGraphemes(text);
                const emojiRegex = /\p{Emoji}/u;
                return graphemes.filter(g => emojiRegex.test(g) && g.trim() !== '');
            };

            const generateCountText = () => {
                if (!inputText.trim()) return '';

                const allEmojis = getEmojiGraphemes(inputText);
                if (allEmojis.length === 0) return '';

                // Aplicar filtro según el modo
                const emojisToCount = countMode === 'hearts' 
                    ? allEmojis.filter(isHeart) 
                    : allEmojis;

                if (emojisToCount.length === 0) {
                    return countMode === 'hearts' ? 'No se detectaron corazones en el texto.' : '';
                }

                // Contar frecuencias
                const counts = {};
                emojisToCount.forEach(emoji => {
                    counts[emoji] = (counts[emoji] || 0) + 1;
                });

                // Ordenar de mayor a menor
                const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);

                // Formatear resultado
                return sorted.map(([emoji, count]) => `${emoji} = ${count}`).join('\n');
            };

            const resultText = generateCountText();
            const hasEnoughInput = resultText.length > 0 && !resultText.startsWith('No se detectaron');

            const handleCopy = async () => {
                if (!hasEnoughInput) return;
                try {
                    await navigator.clipboard.writeText(resultText);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (err) {
                    console.error('Error al copiar: ', err);
                }
            };

            useEffect(() => {
                if (autoCopy && hasEnoughInput) {
                    handleCopy();
                }
            }, [inputText, countMode, autoCopy]);

            return (
                <div className="min-h-screen flex flex-col">
                    
                    <header className="bg-white shadow-sm border-b border-slate-200">
                        <div className="max-w-4xl mx-auto px-4 py-4 flex items-center justify-between">
                            <h1 className="text-xl font-extrabold text-brand tracking-tight">Malekisho</h1>
                            <a href="Dashboard.html" className="text-sm font-medium text-slate-500 hover:text-brand transition-colors flex items-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                                </svg>
                                Volver al Dashboard
                            </a>
                        </div>
                    </header>

                    <main className="flex-grow flex items-center justify-center p-4">
                        <div className="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 transition-all">
                            
                            <div className="p-8 sm:p-10">
                                <div className="text-center mb-6">
                                    <h2 className="text-3xl font-extrabold text-slate-900 tracking-tight flex items-center justify-center gap-2">
                                        <span>📊</span> Contador <span>📊</span>
                                    </h2>
                                    <p className="text-slate-500 mt-2 text-sm">Pega tus emojis y obtén el conteo exacto al instante.</p>
                                </div>

                                <div className="space-y-5">
                                    {/* Selector de Modo (Corazones vs Todos) */}
                                    <div className="flex justify-center gap-6 bg-slate-50 p-3 rounded-lg border border-slate-200">
                                        <label className="flex items-center cursor-pointer group">
                                            <input 
                                                type="radio" 
                                                name="countMode" 
                                                value="hearts" 
                                                checked={countMode === 'hearts'}
                                                onChange={(e) => setCountMode(e.target.value)}
                                                className="w-4 h-4 text-brand bg-white border-slate-300 focus:ring-brand focus:ring-2"
                                            />
                                            <span className={`ml-2 text-sm font-semibold transition-colors ${countMode === 'hearts' ? 'text-brand-dark' : 'text-slate-600 group-hover:text-brand'}`}>
                                                Solo Corazones ❤️
                                            </span>
                                        </label>
                                        <label className="flex items-center cursor-pointer group">
                                            <input 
                                                type="radio" 
                                                name="countMode" 
                                                value="all" 
                                                checked={countMode === 'all'}
                                                onChange={(e) => setCountMode(e.target.value)}
                                                className="w-4 h-4 text-brand bg-white border-slate-300 focus:ring-brand focus:ring-2"
                                            />
                                            <span className={`ml-2 text-sm font-semibold transition-colors ${countMode === 'all' ? 'text-brand-dark' : 'text-slate-600 group-hover:text-brand'}`}>
                                                Todos 🌍
                                            </span>
                                        </label>
                                    </div>

                                    {/* Textarea para los datos */}
                                    <div>
                                        <textarea 
                                            className="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand focus:border-brand outline-none transition-all text-center text-lg resize-none"
                                            rows="3"
                                            placeholder="Pega la ronda de emojis aquí..."
                                            value={inputText}
                                            onChange={(e) => setInputText(e.target.value)}
                                            autoFocus
                                        ></textarea>
                                    </div>

                                    <div className="flex items-center justify-center bg-slate-50 p-3 rounded-lg border border-slate-200">
                                        <label className="flex items-center cursor-pointer">
                                            <div className="relative">
                                                <input 
                                                    type="checkbox" 
                                                    className="sr-only" 
                                                    checked={autoCopy}
                                                    onChange={() => setAutoCopy(!autoCopy)}
                                                />
                                                <div className={`block w-10 h-6 rounded-full transition-colors ${autoCopy ? 'bg-brand' : 'bg-slate-300'}`}></div>
                                                <div className={`dot absolute left-1 top-1 bg-white w-4 h-4 rounded-full transition-transform ${autoCopy ? 'transform translate-x-4' : ''}`}></div>
                                            </div>
                                            <div className="ml-3 text-sm font-medium text-slate-700">Copiar automáticamente</div>
                                        </label>
                                    </div>

                                    {/* Display del resultado */}
                                    <div className="bg-slate-100 rounded-lg border border-slate-200 p-6 min-h-[160px] max-h-[300px] overflow-auto flex justify-center">
                                        <div className="font-mono text-xl leading-relaxed whitespace-pre text-left text-brand-dark">
                                            {resultText 
                                                ? resultText 
                                                : <span className="text-slate-400 text-sm italic font-sans flex justify-center text-center w-full">Esperando emojis para contar...</span>
                                            }
                                        </div>
                                    </div>

                                    {/* Botón Manual de Copiar */}
                                    <button 
                                        onClick={handleCopy}
                                        disabled={!hasEnoughInput}
                                        className={`w-full font-bold py-3 px-4 rounded-lg transition-all shadow-md flex justify-center items-center gap-2
                                            ${!hasEnoughInput 
                                                ? 'bg-slate-200 text-slate-400 cursor-not-allowed shadow-none' 
                                                : copied 
                                                    ? 'bg-green-500 hover:bg-green-600 text-white focus:ring-green-500 shadow-green-500/30'
                                                    : 'bg-brand hover:bg-brand-dark text-white focus:ring-brand shadow-brand/30'
                                            }`}
                                    >
                                        {copied ? '¡Copiado!' : 'Copiar Resultado'}
                                    </button>
                                </div>
                            </div>
                        </div>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ContadorApp />);
    </script>
</body>
</html>
