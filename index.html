<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Malekisho</title>
    <link rel="shortcut icon" href="assets/favicon-16x16.png" type="image/x-icon">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            light: '#4f46e5', // Indigo 600
                            DEFAULT: '#4338ca', // Indigo 700
                            dark: '#3730a3', // Indigo 800
                        }
                    }
                }
            }
        }
    </script>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased selection:bg-brand-light selection:text-white">

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function Login() {
            // Estados para manejar los inputs y errores
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [showError, setShowError] = useState(false);

            // Lógica de inicio de sesión
            const handleLogin = (e) => {
                e.preventDefault(); // Evita que la página recargue
                
                if (username === 'amel' && password === 'amel') {
                    // Redirección exitosa
                    window.location.href = "pages/Dashboard.html";
                } else {
                    // Mostrar error
                    setShowError(true);
                }
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-100 to-slate-200">
                    
                    {/* Tarjeta de Login */}
                    <div className="max-w-md w-full bg-white rounded-2xl shadow-xl overflow-hidden border border-slate-100 transition-all">
                        
                        <div className="p-8 sm:p-10">
                            {/* Cabecera */}
                            <div className="text-center mb-8">
                                <h2 className="text-3xl font-extrabold text-slate-900 tracking-tight">Malekisho</h2>
                                <p className="text-slate-500 mt-2 text-sm">NAKAMAS | SAMAKAN</p>
                            </div>
                            
                            {/* Formulario */}
                            <form onSubmit={handleLogin} className="space-y-6">
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1" htmlFor="username">
                                        Usuario
                                    </label>
                                    <input 
                                        id="username"
                                        type="text" 
                                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand focus:border-brand outline-none transition-all"
                                        placeholder="Ingresa tu usuario"
                                        value={username}
                                        onChange={(e) => {
                                            setUsername(e.target.value); 
                                            setShowError(false); // Ocultar error al escribir
                                        }}
                                        required 
                                    />
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-semibold text-slate-700 mb-1" htmlFor="password">
                                        Contraseña
                                    </label>
                                    <input 
                                        id="password"
                                        type="password" 
                                        className="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg focus:bg-white focus:ring-2 focus:ring-brand focus:border-brand outline-none transition-all"
                                        placeholder="••••••••"
                                        value={password}
                                        onChange={(e) => {
                                            setPassword(e.target.value); 
                                            setShowError(false);
                                        }}
                                        required 
                                    />
                                </div>

                                {/* Alerta de error */}
                                {showError && (
                                    <div className="p-3 rounded-lg bg-red-50 text-red-600 text-sm font-medium border border-red-100 flex items-center animate-pulse">
                                        <svg className="w-5 h-5 mr-2 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
                                            <path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clipRule="evenodd"></path>
                                        </svg>
                                        Credenciales incorrectas.
                                    </div>
                                )}

                                {/* Botón */}
                                <button 
                                    type="submit" 
                                    className="w-full bg-brand hover:bg-brand-dark text-white font-bold py-3 px-4 rounded-lg transition-colors shadow-md focus:ring-2 focus:ring-offset-2 focus:ring-brand"
                                >
                                    Iniciar sesión
                                </button>
                            </form>
                        </div>

                        {/* Footer de la tarjeta */}
                        <div className="px-8 py-5 bg-slate-50 border-t border-slate-100 text-center">
                            <p className="text-sm text-slate-600 font-medium">
                                ¿No tienes una cuenta? <a href="#" className="text-brand hover:text-brand-dark transition-colors">Registrarse</a>
                            </p>
                        </div>

                    </div>
                </div>
            );
        }

        // Renderizado de la app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<Login />);
    </script>
</body>
</html>
